<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>STOMP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="stage-wrap">
      <canvas id="game-canvas" aria-label="STOMP game"></canvas>
      <div id="controls">
        <div id="move-pad" class="control-pad" aria-label="Move">
          <span id="move-hint" class="control-hint">move</span>
          <div id="move-indicator" class="move-indicator"></div>
        </div>
        <div id="jump-pad" class="control-pad" aria-label="Jump">
          <span id="jump-hint" class="control-hint">jump</span>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
