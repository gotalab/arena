<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07151d">
  <title>DELVE</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="game" aria-label="DELVE digging game">
    <canvas id="stage"></canvas>
    <header class="hud" aria-live="polite">
      <div class="brand"><i></i><span>DELVE</span></div>
      <div class="depth"><b id="depth">0000</b><small>m DEEP</small></div>
      <div class="clock" id="clock">
        <div class="clock-top"><span>OXY-TIME</span><b id="time">18.0</b></div>
        <div class="meter"><i id="time-fill"></i></div>
      </div>
    </header>
    <section id="ready" class="ready-card">
      <div class="eyebrow">SHAFT 07 · CLEARANCE OPEN</div>
      <h1>GO<br><em>DEEP.</em></h1>
      <p>Press and drag <strong>down</strong> to dig.<br>Slide sideways to steer.</p>
      <div class="gesture" aria-hidden="true"><span></span><i></i></div>
      <small>Hold ↓ or SPACE · Steer ← →</small>
    </section>
    <section id="gameover" class="end-card" hidden>
      <div class="eyebrow">EXPEDITION COMPLETE</div>
      <div class="rank-wrap"><span>RANK</span><b id="rank">C</b></div>
      <div class="scoreline"><div><small>SCORE</small><b id="final-score">0</b></div><div><small>SESSION BEST</small><b id="best-score">0</b></div></div>
      <div class="signature"><span>CLOSEST SHAVE</span><b id="signature">—</b></div>
      <button id="restart">TAP TO DELVE AGAIN <i>↻</i></button>
      <small>or press R</small>
    </section>
    <div id="toast" class="toast"></div>
    <div id="stick" class="stick" hidden><i></i></div>
    <button id="sound" class="sound" aria-label="Toggle sound">♪</button>
  </main>
  <script src="./game.js"></script>
</body>
</html>
