<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#071820" />
    <title>SHOAL</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="hint" class="out"></div>
      <div id="ceremony" class="hidden">
        <div class="card">
          <h2 id="cer-title">the urchin woke</h2>
          <p class="sub" id="cer-sub">proof broke on that shell</p>
          <div class="scores">
            <div class="score">
              <b id="cer-pearls">0</b>
              <span>pearls</span>
            </div>
            <div class="score">
              <b id="cer-best">0</b>
              <span>best</span>
            </div>
          </div>
          <div class="ladder" id="cer-ladder"></div>
          <p class="sig" id="cer-sig"></p>
          <div class="prompt">tap for another tide</div>
        </div>
      </div>
    </div>
    <script src="js/engine.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/render.js"></script>
    <script src="js/bridge.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
