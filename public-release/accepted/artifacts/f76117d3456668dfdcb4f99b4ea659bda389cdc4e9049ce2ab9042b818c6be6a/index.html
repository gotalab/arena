<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EMBER</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090914;touch-action:none;overscroll-behavior:none}
  body{display:grid;place-items:center;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
  #shell{position:relative;height:100%;width:min(100%,56.25vh);max-height:100%;overflow:hidden;background:#11101e;box-shadow:0 0 60px #000;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #a11y{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-aspect-ratio:9/16){#shell{width:100%;height:100%}}
</style>
</head>
<body>
<main id="shell" aria-label="EMBER vertical climbing game">
  <canvas id="game"></canvas>
  <div id="a11y" aria-live="polite">Pull back and release to launch the spark.</div>
</main>
<script src="game.js"></script>
</body>
</html>
