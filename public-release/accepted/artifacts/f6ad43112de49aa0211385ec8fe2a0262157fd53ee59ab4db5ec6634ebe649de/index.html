<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#081418">
  <title>Lumen Yard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell" id="gameShell">
    <header class="topbar">
      <button class="brand" id="mapButton" aria-label="Open board map" aria-haspopup="dialog">
        <span class="brand-mark" aria-hidden="true">⌁</span>
        <span><strong>LUMEN YARD</strong><small>RESTORATION 01–20</small></span>
      </button>
      <div class="header-actions">
        <button class="icon-button" id="soundButton" aria-label="Toggle sound" aria-pressed="true">♪</button>
        <button class="icon-button" id="motionButton" aria-label="Toggle motion" aria-pressed="true">≈</button>
      </div>
    </header>

    <section class="status" aria-label="Current board status">
      <div><span class="eyebrow" id="boardNumber">CIRCUIT 01</span><h1 id="boardName">First Light</h1></div>
      <div class="meters">
        <span><b id="moves">0</b><small>MOVES</small></span>
        <span><b id="pushes">0</b><small>PUSHES</small></span>
        <span><b id="power">0/1</b><small>POWERED</small></span>
      </div>
    </section>

    <section class="yard-wrap" id="yardWrap">
      <div class="skyline" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="yard" id="yard" role="grid" aria-label="Power yard puzzle"></div>
      <div class="surge" id="surge" aria-hidden="true"></div>
      <p class="invitation" id="invitation">Restore the grid.</p>
    </section>

    <section class="controls" aria-label="Game controls">
      <button id="undoButton"><span aria-hidden="true">↶</span> Undo</button>
      <div class="best" id="bestLabel"><span>BEST</span><strong>—</strong></div>
      <button id="restartButton"><span aria-hidden="true">↻</span> Restart</button>
    </section>
  </main>

  <div class="modal-backdrop" id="completionBackdrop" hidden>
    <section class="completion-card" role="dialog" aria-modal="true" aria-labelledby="completionTitle">
      <div class="completion-glyph" aria-hidden="true">⌁</div>
      <p class="eyebrow" id="completionKicker">CIRCUIT POWERED</p>
      <h2 id="completionTitle">First Light restored</h2>
      <p id="completionText">Current is flowing through the yard.</p>
      <div class="summary" id="campaignSummary" hidden></div>
      <div class="modal-actions">
        <button class="secondary" id="replayButton">Replay</button>
        <button class="primary" id="nextButton">Next circuit <span>→</span></button>
      </div>
      <button class="text-button" id="completionMapButton">Board Map</button>
    </section>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="mapTitle">
      <header><div><p class="eyebrow">RESTORATION LOG</p><h2 id="mapTitle">Board Map</h2></div><button class="icon-button" id="closeMap" aria-label="Close board map">×</button></header>
      <div class="progress-copy"><strong id="progressText">0 / 20 restored</strong><span id="progressBar"><i></i></span></div>
      <div class="level-grid" id="levelGrid"></div>
      <p class="yard-credit">A night shift by the Lumen Yard crew.</p>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="game.js"></script>
</body>
</html>
