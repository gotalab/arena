<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#082f3a">
  <title>SHOAL</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="game" aria-label="SHOAL tide pool game">
    <div class="water-light" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◌</span>
        <div><h1>SHOAL</h1><small id="pool-label">POOL I</small></div>
      </div>
      <div class="score"><small>PEARLS</small><strong id="pearls">0</strong></div>
    </header>

    <section class="tide-wrap" aria-label="Tide remaining">
      <div class="tide-meta"><span>TIDE</span><span id="tide-text">WAITING</span></div>
      <div class="tide-track"><div id="tide-fill"></div></div>
    </section>

    <section class="pool-stage">
      <div id="host" class="host curious" aria-hidden="true">
        <div class="host-tail"></div>
        <div class="host-body"><i></i><i></i><b></b></div>
        <div id="host-bubble" class="host-bubble">A quiet shell starts the tide.</div>
      </div>
      <div id="board" class="board" role="grid" aria-label="Shell grid"></div>
      <div id="ripple-layer" aria-hidden="true"></div>
    </section>

    <footer class="dock">
      <div class="counter">
        <span class="pennant-icon">◆</span>
        <div><strong id="urchins-left">0</strong><small>URCHINS LEFT</small></div>
      </div>
      <div id="hint" class="hint">Tap a shell to begin</div>
      <button id="sound" class="sound" aria-label="Toggle sound" type="button">♪</button>
    </footer>

    <div id="toast" role="status" aria-live="polite"></div>

    <section id="ceremony" class="ceremony" aria-hidden="true">
      <div class="ceremony-card">
        <div class="sting-glyph">✦</div>
        <small>THE WATER REMEMBERS</small>
        <h2 id="rank">DRIFTWOOD</h2>
        <div class="result-row">
          <div><span id="final-pearls">0</span><small>PEARLS</small></div>
          <div><span id="best-pearls">0</span><small>SESSION BEST</small></div>
        </div>
        <div class="signature">
          <span>DEEPEST WATER</span>
          <strong id="deepest">POOL I</strong>
        </div>
        <div id="rank-ladder" class="rank-ladder"></div>
        <button id="restart" type="button">TOUCH THE WATER AGAIN</button>
      </div>
    </section>
  </main>
  <script src="./game.js"></script>
</body>
</html>
