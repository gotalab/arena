<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SHOAL</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header id="hud">
    <div id="tideRow">
      <span id="tideLabel">TIDE</span>
      <div id="tideTrack"><div id="tideFill"></div></div>
      <button id="soundBtn" type="button" aria-label="Toggle sound" title="Sound">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="spk" d="M4 9.5h3.5L12 6v12L7.5 14.5H4z"/>
          <path class="wave" d="M15.2 9.2a4 4 0 0 1 0 5.6M17.8 6.8a7.6 7.6 0 0 1 0 10.4"/>
          <path class="mute" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
    </div>
    <div id="statRow">
      <div class="stat">
        <span class="k">POOL</span><span class="v" id="poolVal">1</span>
      </div>
      <div class="stat" id="urchinStat" title="Urchins left to pennant">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <g class="spikes"><path d="M12 1.6v20.8M1.6 12h20.8M4.6 4.6l14.8 14.8M19.4 4.6L4.6 19.4"/></g>
          <circle class="core" cx="12" cy="12" r="5.1"/>
        </svg>
        <span class="v" id="urchinVal">7</span>
      </div>
      <div class="stat">
        <svg class="ico pearl" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8"/>
          <circle class="shine" cx="9.4" cy="9.4" r="2.5"/>
        </svg>
        <span class="v" id="pearlVal">0</span>
      </div>
      <div class="stat best">
        <span class="k">BEST</span><span class="v" id="bestVal">0</span>
      </div>
    </div>
  </header>

  <main id="stage">
    <canvas id="board"></canvas>

    <div id="title" class="show">
      <h1>SHOAL</h1>
      <p>tap a shell</p>
    </div>

    <div id="toast" aria-live="polite"></div>
    <div id="banner"></div>

    <div id="ceremony" class="hidden" role="dialog" aria-label="Run over">
      <div class="cer-card">
        <div class="cer-kicker">the tide turns</div>
        <div class="cer-pearls"><span id="cerPearls">0</span><small>pearls</small></div>
        <div class="cer-rank" id="cerRank">Driftwood</div>
        <div class="cer-ladder" id="cerLadder"></div>
        <div class="cer-lines">
          <div class="cer-line"><span id="cerStatLabel">widest ripple</span><b id="cerStat">0</b></div>
          <div class="cer-line"><span>deepest pool</span><b id="cerDepth">1</b></div>
          <div class="cer-line best"><span>session best</span><b id="cerBest">0</b></div>
        </div>
        <div class="cer-hint" id="cerHint">tap to swim again</div>
      </div>
    </div>
  </main>

</div>

<script src="js/rng.js"></script>
<script src="js/generator.js"></script>
<script src="js/game.js"></script>
<script src="js/audio.js"></script>
<script src="js/view.js"></script>
<script src="js/input.js"></script>
<script src="js/bridge.js"></script>
<script src="js/main.js"></script>
</body>
</html>
