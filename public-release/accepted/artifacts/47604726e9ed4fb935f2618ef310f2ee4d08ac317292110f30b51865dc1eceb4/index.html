<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DELVE — a one-thumb descent</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #060410;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #stage-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    outline: none;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="stage-canvas" tabindex="0"></canvas>
<script src="game/core.js"></script>
<script src="game/audio.js"></script>
<script src="game/input.js"></script>
<script src="game/view.js"></script>
<script src="game/main.js"></script>
</body>
</html>
