<body><canvas id="game" aria-label="DELVE digging game. Drag down to accelerate and sideways to steer."></canvas><div class="sr" aria-live="polite" id="live"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),live=document.getElementById('live');
const STEP=1000/60, PREVIEW=1050, BACK=120, PLAYER_R=18, MAX_SPEED=340, CRAWL=62, START_TIME=14500, MAX_TIME=22000;
const TAU=Math.PI*2;
let W=1,H=1,DPR=1,scale=1,playerY=180,rafLast=0,realAcc=0,shake=0,flash=0,particles=[],audio=null,pointer=null,sessionBest=0;
let S;
const input={left:false,right:false,accelerate:false,steer:0};
function hashSeed(v){let n;if(typeof v==='number'&&isFinite(v))n=v>>>0;else{let s=String(v??'delve');n=2166136261;for(let i=0;i<s.length;i++)n=Math.imul(n^s.charCodeAt(i),16777619)}return n>>>0||0x6d2b79f5}
function rng(){let t=S.rngState+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
function rr(a,b){return a+(b-a)*rng()}
function emit(kind){const e={seq:++S.eventSeq,kind,tick:S.tick};S.events.push(e);if(S.events.length>160)S.events.shift();S.lastEvent=e}
function ensureKnots(target){while(S.knots[S.knots.length-1].d<target+220){const a=S.knots[S.knots.length-1],d=a.d+180;const diff=Math.min(1,d/7000);let delta=rr(-115,115)*(0.45+diff*.55);if(S.knots.length<5)delta*=.35;let c=Math.max(-145,Math.min(145,a.c+delta));if(Math.abs(c)>130)c*=.88;const w=rr(145,181)-diff*12;S.knots.push({d,c,w})}}
function knotAt(d){ensureKnots(d);const k=S.knots;let i=Math.max(0,Math.min(k.length-2,Math.floor(d/180)));while(i<k.length-2&&k[i+1].d<d)i++;while(i>0&&k[i].d>d)i--;const a=k[i],b=k[i+1],t=Math.max(0,Math.min(1,(d-a.d)/(b.d-a.d))),q=t*t*(3-2*t);return{c:a.c+(b.c-a.c)*q,w:a.w+(b.w-a.w)*q}}
function ensureCourse(target){ensureKnots(target);while(S.generatedTo<target){generateBand(S.generatedTo);S.generatedTo+=420}}
function safeX(d){const q=knotAt(d);return q.c+Math.sin(d/330+S.seed*.001)*Math.min(45,q.w*.28)}
function addItem(type,x,d,extra={}){S.items.push({id:++S.spawnIndex,type,position:{x,depth:d},active:true,visualRadius:type==='power'?18:11,collisionRadius:type==='power'?15:9,...extra})}
function addRock(x,d,r){S.rocks.push({id:++S.spawnIndex,position:{x,depth:d},active:true,visualRadius:r,collisionRadius:r*.88,hit:false,passed:false})}
function generateBand(base){
 const q=knotAt(base+230),diff=Math.min(1,(base+200)/9000),route=safeX(base+230);
 // Obstacles are posed around a guaranteed machine-width route.
 const count=base<500?1:(rng()<.28+diff*.2?3:2);
 for(let i=0;i<count;i++){const d=base+110+i*(230/Math.max(1,count-1))+rr(-30,30);const c=knotAt(d),safe=safeX(d),side=rng()<.5?-1:1;let r=rr(22,38+diff*12);let x=safe+side*(r+PLAYER_R+rr(27,54));x=Math.max(c.c-c.w+r+8,Math.min(c.c+c.w-r-8,x));if(Math.abs(x-safe)<r+PLAYER_R+20)x=safe-side*(r+PLAYER_R+28);addRock(x,d,r)}
 // Deliberate sweepable formations, not a uniform sprinkle.
 if(base>180&&Math.floor(base/420)%2===0){const kind=['line','chevron','sweep'][Math.floor(rng()*3)],fid=++S.formationId,n=kind==='chevron'?5:4;for(let i=0;i<n;i++){const d=base+70+i*42;const c=knotAt(d),route=safeX(d);let off=0;if(kind==='line')off=(i-(n-1)/2)*13;else if(kind==='chevron')off=(i<3?i:4-i)*25-25;else off=Math.sin(i/(n-1)*Math.PI)*48-20;const x=Math.max(c.c-c.w+28,Math.min(c.c+c.w-28,route+off));addItem('fragment',x,d,{formationId:fid,formationKind:kind,formationIndex:i})}}
 // Guaranteed early treat, then rare deterministic treats.
 if((base===840)|| (base>2400&&rng()<.075)){const d=base+205;addItem('power',safeX(d),d)}
 S.rocks.sort((a,b)=>a.id-b.id);S.items.sort((a,b)=>a.id-b.id)
}
function reset(seed=S?.seed??1){
 const hs=hashSeed(seed);Object.assign(input,{left:false,right:false,accelerate:false,steer:0});pointer=null;particles=[];shake=flash=realAcc=0;
 S={phase:'ready',tick:0,timeMs:0,remainingMs:START_TIME,seed:hs,rngState:hs,spawnIndex:0,difficulty:0,score:0,depth:0,x:0,vx:0,speed:CRAWL,hits:0,wallContacts:0,fragmentsCollected:0,rocksBroken:0,invincibleUntilMs:0,rank:null,knots:[{d:-180,c:0,w:178},{d:0,c:0,w:178},{d:180,c:8,w:174}],generatedTo:0,rocks:[],items:[],formationId:0,events:[],eventSeq:0,lastEvent:null,wallLock:false,fullStretch:0,bestFullStretch:0,closest:999,nearCombo:0,nearTimer:0,hitAnim:0,grazeAnim:0,powerPulse:0};
 ensureCourse(PREVIEW+300);live.textContent='Ready to delve';return snapshot()
}
function beginIfNeeded(){if(S.phase==='ready'&&input.accelerate){S.phase='playing';audioStart();live.textContent='Run started'}}
function burst(x,y,color,n=10,power=1){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=(30+Math.random()*100)*power;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.45,max:.8,color,size:2+Math.random()*4})}}
function sound(type,intensity=1){if(!audio)return;audio.blip(type,intensity)}
function collideRock(r){r.active=false;r.hit=true;const powered=S.timeMs<S.invincibleUntilMs;if(powered){S.rocksBroken++;S.remainingMs=Math.min(MAX_TIME,S.remainingMs+800);emit('rock_broken');sound('break',1.2);burstWorld(r.position.x,r.position.depth,'#ffdd74',16,1.4)}else{S.hits++;S.speed=CRAWL;S.vx*=-.18;S.hitAnim=1;S.nearCombo=0;shake=Math.max(shake,13);flash=.55;emit('rock_hit');sound('hit');burstWorld(r.position.x,r.position.depth,'#cf705c',18,1.5)}}
function burstWorld(x,d,c,n,p){const sp=viewPoint(x,d);burst(sp.x,sp.y,c,n,p)}
function step(){
 if(S.phase!=='playing')return;S.tick++;S.timeMs=S.tick*STEP;S.remainingMs-=STEP;S.difficulty=1+S.depth/6500;
 const throttle=input.accelerate;const target=throttle?MAX_SPEED:CRAWL;const rate=throttle?145:105;S.speed+=(target-S.speed)*Math.min(1,rate/Math.max(1,Math.abs(target-S.speed))*STEP/1000);S.speed=Math.max(CRAWL,Math.min(MAX_SPEED,S.speed));
 const steer=Math.max(-1,Math.min(1,(input.right?1:0)-(input.left?1:0)+input.steer));const speedN=(S.speed-CRAWL)/(MAX_SPEED-CRAWL);const authority=285*(1-.69*speedN);const desired=steer*authority;S.vx+=(desired-S.vx)*Math.min(1,(5.4-2.5*speedN)*STEP/1000);if(!steer)S.vx*=Math.pow(.15,STEP/1000);S.x+=S.vx*STEP/1000;S.depth+=S.speed*STEP/1000;
 if(S.speed>MAX_SPEED*.965&&throttle){S.fullStretch+=STEP;S.bestFullStretch=Math.max(S.bestFullStretch,S.fullStretch)}else S.fullStretch=0;
 ensureCourse(S.depth+PREVIEW+300);const c=knotAt(S.depth),limit=c.w-PLAYER_R;let wall=false;if(S.x<c.c-limit){S.x=c.c-limit;wall=true;S.vx=Math.max(0,-S.vx*.12)}else if(S.x>c.c+limit){S.x=c.c+limit;wall=true;S.vx=Math.min(0,-S.vx*.12)}if(wall&&!S.wallLock){S.wallContacts++;S.speed=CRAWL;S.hitAnim=1;S.nearCombo=0;shake=Math.max(shake,11);flash=.4;emit('wall_contact');sound('hit',.8)}S.wallLock=wall;
 for(const r of S.rocks){if(!r.active)continue;const dz=r.position.depth-S.depth;if(Math.abs(dz)<PLAYER_R+r.collisionRadius){const dx=r.position.x-S.x;if(Math.hypot(dx,dz)<PLAYER_R+r.collisionRadius)collideRock(r)}if(!r.passed&&dz<-r.collisionRadius){r.passed=true;if(r.active){const gap=Math.abs(r.position.x-S.x)-r.collisionRadius-PLAYER_R;if(gap>=0&&gap<PLAYER_R*2){S.closest=Math.min(S.closest,gap);S.nearCombo++;S.nearTimer=1800;S.grazeAnim=Math.min(1.6,.65+S.nearCombo*.16);shake=Math.max(shake,2+S.nearCombo);emit('near_miss');sound('near',Math.min(1.8,.8+S.nearCombo*.15))}}}}
 for(const it of S.items){if(!it.active)continue;const dz=it.position.depth-S.depth;if(Math.abs(dz)<PLAYER_R+it.collisionRadius&&Math.hypot(it.position.x-S.x,dz)<PLAYER_R+it.collisionRadius){it.active=false;if(it.type==='fragment'){S.fragmentsCollected++;S.remainingMs=Math.min(MAX_TIME,S.remainingMs+1750);emit('fragment');sound('fragment');burstWorld(it.position.x,it.position.depth,'#75f1d5',8,1)}else{S.invincibleUntilMs=S.timeMs+6200;S.powerPulse=1;emit('power');sound('power');burstWorld(it.position.x,it.position.depth,'#ffd86e',24,1.6)}}}
 S.nearTimer=Math.max(0,S.nearTimer-STEP);if(!S.nearTimer)S.nearCombo=0;S.hitAnim=Math.max(0,S.hitAnim-STEP/420);S.grazeAnim=Math.max(0,S.grazeAnim-STEP/650);S.powerPulse=Math.max(0,S.powerPulse-STEP/900);
 S.score=Math.floor(S.depth*10)/10;
 if(S.remainingMs<=0){S.remainingMs=0;S.phase='gameover';S.rank=grade(S.score);sessionBest=Math.max(sessionBest,S.score);S.speed=CRAWL;input.accelerate=false;input.steer=0;sound('end');live.textContent=`Run over. Score ${Math.floor(S.score)}, rank ${S.rank}. Tap to retry.`}
}
function grade(v){return v>=8500?'S':v>=5600?'A':v>=3400?'B':v>=1800?'C':'D'}
function advance(ms){if(S.phase==='ready'||S.phase==='gameover')return snapshot();realAcc+=Math.max(0,Number(ms)||0);let guard=0;while(realAcc+1e-7>=STEP&&guard++<100000){realAcc-=STEP;step();if(S.phase==='gameover'){realAcc=0;break}}return snapshot()}

function snapshot(){

 const items=S.items.filter(e=>e.position.depth>=from&&e.position.depth<=to).map(e=>{const o={id:e.id,type:e.type,position:{x:round(e.position.x),depth:round(e.position.depth)},active:e.active,visualRadius:e.visualRadius,collisionRadius:e.collisionRadius};if(e.type==='fragment')Object.assign(o,{formationId:e.formationId,formationKind:e.formationKind,formationIndex:e.formationIndex});return o});

 return{phase:S.phase,tick:S.tick,elapsedMs:round(S.timeMs),timeMs:round(S.timeMs),remainingMs:round(S.remainingMs),seed:S.seed,rngState:S.rngState>>>0,spawnIndex:S.spawnIndex,input:{left:input.left,right:input.right,accelerate:input.accelerate,steer:round(input.steer)},difficulty:round(S.difficulty),score:round(S.score),depth:round(S.depth),x:round(S.x),playerRadius:PLAYER_R,speed:round(S.speed),maxSpeed:MAX_SPEED,hits:S.hits,wallContacts:S.wallContacts,fragmentsCollected:S.fragmentsCollected,rocksBroken:S.rocksBroken,invincibleUntilMs:round(S.invincibleUntilMs),rank:S.rank,courseCenterX:round(center.c),corridorHalfWidth:round(center.w),walls,safeHalfWidth:round(safe),previewMs:round(PREVIEW/MAX_SPEED*1000),rocks,items,events:S.events.map(e=>({...e})),lastEvent:S.lastEvent?{...S.lastEvent}:null}
}
window.__ARENA_GAME__={reset,snapshot,advance};
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);scale=Math.max(.38,Math.min(.76,H/(PREVIEW+180),W/520));playerY=Math.max(126,Math.min(H*.24,210))}addEventListener('resize',resize);
function viewPoint(x,d){return{x:W/2+(x-S.x)*scale,y:playerY+(d-S.depth)*scale}}
function pathWalls(){const ptsL=[],ptsR=[];for(let y=-40;y<H+60;y+=22){const d=S.depth+(y-playerY)/scale,q=knotAt(Math.max(-100,d));ptsL.push([W/2+(q.c-q.w-S.x)*scale,y]);ptsR.push([W/2+(q.c+q.w-S.x)*scale,y])}return{ptsL,ptsR}}
function poly(points){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1])}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171329');g.addColorStop(.5,'#090c18');g.addColorStop(1,'#050711');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.24;for(let i=0;i<28;i++){const x=((i*97+S.seed%83)%W),y=((i*149+S.depth*.04)% (H+80))-40;ctx.fillStyle=i%3?'#554c78':'#9b6b74';ctx.beginPath();ctx.arc(x,y,1+(i%3),0,TAU);ctx.fill()}ctx.globalAlpha=1}
function drawCourse(){const {ptsL,ptsR}=pathWalls();ctx.fillStyle='#251d35';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ptsL[0][0],ptsL[0][1]);for(const p of ptsL)ctx.lineTo(...p);ctx.lineTo(0,H);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(ptsR[0][0],ptsR[0][1]);for(const p of ptsR)ctx.lineTo(...p);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
 ctx.lineWidth=10;ctx.strokeStyle='#5a3856';ctx.lineJoin='round';poly(ptsL);ctx.stroke();poly(ptsR);ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle='#b15b67';poly(ptsL);ctx.stroke();poly(ptsR);ctx.stroke();
 // strata marks create readable speed
 ctx.globalAlpha=.25;for(let d=Math.floor((S.depth-BACK)/90)*90;d<S.depth+PREVIEW;d+=90){const q=knotAt(d),y=playerY+(d-S.depth)*scale;ctx.strokeStyle='#d28a72';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(Math.max(0,W/2+(q.c-q.w-S.x)*scale-7),y-7);ctx.stroke();ctx.beginPath();ctx.moveTo(W,y);ctx.lineTo(Math.min(W,W/2+(q.c+q.w-S.x)*scale+7),y-7);ctx.stroke()}ctx.globalAlpha=1}
function drawRock(r){const p=viewPoint(r.position.x,r.position.depth),z=r.visualRadius*scale;if(p.y<-50||p.y>H+50)return;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(r.id*.91);ctx.fillStyle='#4b405b';ctx.strokeStyle='#9b6674';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<9;i++){const a=i/9*TAU,rad=z*(.82+.15*Math.sin(i*13.4));ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#241d31';ctx.beginPath();ctx.arc(-z*.2,-z*.15,z*.19,0,TAU);ctx.fill();ctx.restore()}
function drawItem(it){const p=viewPoint(it.position.x,it.position.depth),t=performance.now()/1000;if(p.y<-30||p.y>H+30)return;ctx.save();ctx.translate(p.x,p.y);if(it.type==='fragment'){ctx.rotate(t*2+it.id);ctx.shadowBlur=14;ctx.shadowColor='#6fffe0';ctx.fillStyle='#9af6dc';ctx.strokeStyle='#e6fff5';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(7,0);ctx.lineTo(0,10);ctx.lineTo(-7,0);ctx.closePath();ctx.fill();ctx.stroke()}else{ctx.rotate(-t);ctx.shadowBlur=22;ctx.shadowColor='#ffcc65';ctx.fillStyle='#ffdc73';ctx.strokeStyle='#fff3bc';ctx.lineWidth=3;for(let i=0;i<12;i++){const a=i/12*TAU,r=i%2?11:18;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.beginPath();ctx.fillStyle='#713f62';ctx.arc(0,0,6,0,TAU);ctx.fill()}ctx.restore()}
function drawMachine(){const powered=S.timeMs<S.invincibleUntilMs,p=S.speed/MAX_SPEED,t=performance.now()/1000;ctx.save();let sx=W/2,sy=playerY;if(S.hitAnim>0){sx-=10*S.hitAnim;ctx.rotate(-.18*S.hitAnim)}if(S.grazeAnim>0){ctx.rotate(Math.sin(t*30)*.08*S.grazeAnim)}ctx.translate(sx,sy);const stretch=S.phase==='playing'?(p>.78?(p-.78)*18:0):0;if(powered){ctx.shadowBlur=24;ctx.shadowColor='#ffd861';ctx.strokeStyle=`rgba(255,221,104,${.5+.3*Math.sin(t*12)})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,29+Math.sin(t*9)*3,0,TAU);ctx.stroke()}// exhaust / tail

 // side treads

 // body and drill nose downward
 ctx.fillStyle=S.hitAnim?'#b6575d':powered?'#f2a95f':'#dd6c70';ctx.strokeStyle='#ffd0a1';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-14,-22,28,39+stretch,11);ctx.fill();ctx.stroke();ctx.fillStyle='#f4c36c';ctx.beginPath();ctx.moveTo(-11,17+stretch);ctx.lineTo(0,34+stretch);ctx.lineTo(11,17+stretch);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-7,22+stretch);ctx.lineTo(7,22+stretch);ctx.moveTo(-4,28+stretch);ctx.lineTo(4,28+stretch);ctx.stroke();
 // face: eye posture expresses state

function drawUI(){const pad=Math.max(14,Math.min(24,W*.04)),barW=Math.min(230,W*.52),danger=S.remainingMs<4500;ctx.save();ctx.fillStyle='rgba(12,11,25,.82)';ctx.strokeStyle='rgba(255,214,157,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(pad,pad,barW,54,15);ctx.fill();ctx.stroke();ctx.fillStyle='#eee0ca';ctx.font='800 11px system-ui';ctx.fillText('LAMPLIGHT',pad+14,pad+18);ctx.fillStyle='#30273b';ctx.beginPath();ctx.roundRect(pad+13,pad+27,barW-26,13,7);ctx.fill();const frac=S.remainingMs/MAX_TIME;ctx.fillStyle=danger?(Math.sin(performance.now()/130)>0?'#ff5e68':'#b83d59'):'#67e1c8';ctx.beginPath();ctx.roundRect(pad+13,pad+27,(barW-26)*frac,13,7);ctx.fill();ctx.fillStyle='#f5d991';ctx.textAlign='right';ctx.font='900 19px system-ui';ctx.fillText(Math.max(0,S.remainingMs/1000).toFixed(1),W-pad,pad+22);ctx.fillStyle='#bca9bd';ctx.font='700 10px system-ui';ctx.fillText('SECONDS',W-pad,pad+37);ctx.font='900 16px system-ui';ctx.fillStyle='#f5e9d7';ctx.fillText(Math.floor(S.score).toString().padStart(5,'0'),W-pad,pad+58);ctx.textAlign='left';
 if(S.phase==='ready'){const y=Math.min(H-100,playerY+100);ctx.textAlign='center';ctx.fillStyle='rgba(10,9,22,.75)';ctx.beginPath();ctx.roundRect(W/2-130,y-36,260,78,18);ctx.fill();ctx.fillStyle='#f6deb3';ctx.font='900 20px system-ui';ctx.fillText('PUSH DOWN TO DELVE',W/2,y-7);ctx.font='600 12px system-ui';ctx.fillStyle='#b9aabd';ctx.fillText('drag sideways to steer',W/2,y+17)}
 if(S.phase==='playing'&&S.timeMs<6500){ctx.textAlign='center';ctx.font='700 12px system-ui';ctx.fillStyle=`rgba(229,216,197,${Math.max(0,1-S.timeMs/6500)})`;ctx.fillText('ease up to turn tighter',W/2,H-30)}
 if(S.timeMs<S.invincibleUntilMs){ctx.textAlign='center';ctx.font='900 13px system-ui';ctx.fillStyle='#ffe278';ctx.fillText('★ CRUSH MODE ★',W/2,pad+18)}ctx.restore()}
function drawStick(){if(!pointer)return;ctx.save();ctx.globalAlpha=.65;ctx.lineWidth=2;ctx.strokeStyle='#f3d8a8';ctx.fillStyle='rgba(107,224,202,.15)';ctx.beginPath();ctx.arc(pointer.ox,pointer.oy,31,0,TAU);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(pointer.x,pointer.y,14,0,TAU);ctx.fillStyle=input.accelerate?'#67dfc7':'#735d79';ctx.fill();ctx.restore()}
function drawGameover(){ctx.save();ctx.fillStyle='rgba(7,7,18,.72)';ctx.fillRect(0,0,W,H);const bw=Math.min(360,W-34),bh=Math.min(360,H-70),x=(W-bw)/2,y=(H-bh)/2;ctx.fillStyle='#211a31';ctx.strokeStyle='#ad6170';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x,y,bw,bh,26);ctx.fill();ctx.stroke();ctx.textAlign='center';ctx.fillStyle='#a795ad';ctx.font='800 11px system-ui';ctx.fillText('THE LIGHT WENT QUIET',W/2,y+35);ctx.fillStyle='#f8dda3';ctx.font='900 70px system-ui';ctx.fillText(S.rank,W/2,y+110);ctx.font='800 11px system-ui';ctx.fillStyle='#ad9cb3';ctx.fillText('RANK',W/2,y+130);ctx.strokeStyle='#49364d';ctx.beginPath();ctx.moveTo(x+30,y+147);ctx.lineTo(x+bw-30,y+147);ctx.stroke();ctx.fillStyle='#f7ead7';ctx.font='900 28px system-ui';ctx.fillText(Math.floor(S.score),W/2-55,y+188);ctx.fillStyle='#f5d991';ctx.fillText(Math.floor(sessionBest),W/2+65,y+188);ctx.fillStyle='#9c8ca5';ctx.font='700 10px system-ui';ctx.fillText('SCORE',W/2-55,y+205);ctx.fillText('SESSION BEST',W/2+65,y+205);ctx.font='800 14px system-ui';ctx.fillStyle='#72dec8';ctx.fillText(`BEST FULL THROTTLE  ${(S.bestFullStretch/1000).toFixed(1)}s`,W/2,y+238);ctx.fillStyle='#a896ad';ctx.fillText(`SHAVES ${S.events.filter(e=>e.kind==='near_miss').length}  •  HITS ${S.hits+S.wallContacts}`,W/2,y+265);ctx.fillStyle='#df7b79';ctx.beginPath();ctx.roundRect(x+38,y+bh-64,bw-76,42,16);ctx.fill();ctx.fillStyle='#fff1d6';ctx.font='900 14px system-ui';ctx.fillText('TAP TO DIG AGAIN',W/2,y+bh-38);ctx.restore()}
function render(dt){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake=Math.max(0,shake-dt*22)}drawBackground();drawCourse();for(const i of S.items)if(i.active)drawItem(i);for(const r of S.rocks)if(r.active)drawRock(r);drawMachine();ctx.restore();for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill()}ctx.globalAlpha=1;if(flash>0){ctx.fillStyle=`rgba(255,110,105,${flash*.25})`;ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-dt*2.8)}drawUI();drawStick();if(S.phase==='gameover')drawGameover()}
function frame(t){if(!rafLast)rafLast=t;const dt=Math.min(100,t-rafLast);rafLast=t;if(S.phase==='playing')advance(dt);render(dt/1000);requestAnimationFrame(frame)}
function setPointer(e){const dx=e.clientX-pointer.ox,dy=e.clientY-pointer.oy;pointer.x=e.clientX;pointer.y=e.clientY;input.steer=Math.max(-1,Math.min(1,dx/55));input.accelerate=dy>18;beginIfNeeded()}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);if(S.phase==='gameover'){reset(S.seed);input.accelerate=true;beginIfNeeded();pointer={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};return}pointer={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};audioStart()});canvas.addEventListener('pointermove',e=>{if(pointer&&e.pointerId===pointer.id)setPointer(e)});function pointerUp(e){if(pointer&&e.pointerId===pointer.id){pointer=null;input.steer=0;input.accelerate=false}}canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);
document.addEventListener('keydown',e=>{if(['ArrowDown','Space','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();audioStart();if(e.code==='KeyR'){reset(S.seed);return}if(e.code==='ArrowDown'||e.code==='Space')input.accelerate=true;if(e.code==='ArrowLeft')input.left=true;if(e.code==='ArrowRight')input.right=true;beginIfNeeded()},{passive:false});document.addEventListener('keyup',e=>{if(['ArrowDown','Space','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='ArrowDown'||e.code==='Space')input.accelerate=false;if(e.code==='ArrowLeft')input.left=false;if(e.code==='ArrowRight')input.right=false},{passive:false});
function audioStart(){if(audio)return;try{const ac=new (window.AudioContext||window.webkitAudioContext)(),master=ac.createGain();master.gain.value=.09;master.connect(ac.destination);const eng=ac.createOscillator(),eg=ac.createGain();eng.type='sawtooth';eng.frequency.value=48;eg.gain.value=.18;eng.connect(eg).connect(master);eng.start();audio={ac,master,eng,eg,blip(type,k=1){const o=ac.createOscillator(),g=ac.createGain(),now=ac.currentTime;let f=220,d=.18;o.type='triangle';if(type==='fragment'){f=660;d=.13}else if(type==='hit'){f=75;d=.28;o.type='sawtooth'}else if(type==='break'){f=125;d=.2;o.type='square'}else if(type==='power'){f=330;d=.6}else if(type==='near'){f=420+S.nearCombo*65;d=.12}else if(type==='end'){f=140;d=.8}o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(Math.max(45,type==='fragment'?f*1.5:f*.55),now+d);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.22*k,now+.015);g.gain.exponentialRampToValueAtTime(.001,now+d);o.connect(g).connect(master);o.start(now);o.stop(now+d+.03)}};setInterval(()=>{if(audio&&S){const n=(S.speed-CRAWL)/(MAX_SPEED-CRAWL);audio.eng.frequency.setTargetAtTime(42+n*55+S.nearCombo*3,audio.ac.currentTime,.08);audio.eg.gain.setTargetAtTime(S.phase==='playing'?.10+n*.17:0.035,audio.ac.currentTime,.12)}},80)}catch(e){audio=null}}
reset(1);resize();requestAnimationFrame(frame);
})();
</script></body></html>
