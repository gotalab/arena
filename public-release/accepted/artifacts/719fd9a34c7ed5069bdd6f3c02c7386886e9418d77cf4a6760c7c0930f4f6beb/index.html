<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>STOMP - Arcade Score Attack</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    #gameContainer {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 450px;
      max-height: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(56, 189, 248, 0.15);
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      touch-action: none;
    }

    #muteBtn {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s ease;
    }

    #muteBtn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <button id="muteBtn" aria-label="Toggle Mute" title="Toggle Sound">🔊</button>
    <canvas id="gameCanvas" width="400" height="700"></canvas>
  </div>

  <script src="js/sim.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
